<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplayer Cursors</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: sans-serif;
      user-select: none;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #ffffff;
      font-size: 14px;
      pointer-events: none;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 12px;
      border-radius: 6px;
    }
    .cursor {
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: left 0.05s linear, top 0.05s linear;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
    }
  </style>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div id="info">Водите мышкой по экрану. Игроков онлайн: <span id="count">1</span></div>

  <script>
    const socket = io();
    const cursorElements = {};
    const countEl = document.getElementById('count');

    // Передаём координаты в процентах (чтобы у всех экранов всё совпадало)
    window.addEventListener('mousemove', (e) => {
      const xPercent = e.clientX / window.innerWidth;
      const yPercent = e.clientY / window.innerHeight;
      socket.emit('move', { x: xPercent, y: yPercent });
    });

    // Обновляем курсоры других игроков
    socket.on('updateState', (players) => {
      countEl.textContent = Object.keys(players).length;

      for (const id in players) {
        if (id === socket.id) continue;

        const data = players[id];
        let el = cursorElements[id];

        if (!el) {
          el = document.createElement('div');
          el.className = 'cursor';
          el.style.backgroundColor = data.color;
          document.body.appendChild(el);
          cursorElements[id] = el;
        }

        el.style.left = (data.x * window.innerWidth) + 'px';
        el.style.top = (data.y * window.innerHeight) + 'px';
      }

      for (const id in cursorElements) {
        if (!players[id]) {
          cursorElements[id].remove();
          delete cursorElements[id];
        }
      }
    });
  </script>
</body>
</html>
